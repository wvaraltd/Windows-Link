name: Publish Windows installer
on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and publish installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          installer="ARA-IAX-Windows-Setup-v$version.exe"
          test -f "$installer"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "v$version" "$installer" SHA256SUMS --target "$GITHUB_SHA" --title "ARA IAX Windows v$version" --notes-file RELEASE-NOTES.md
